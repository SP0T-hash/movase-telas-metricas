<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,viewport-fit=cover,initial-scale=1,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Movase — Carregando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: light-dark(#FFFFFF, #0C0A09);
      --fg: light-dark(#0A0A0A, #FAFAF9);
      --accent: #F58220;
      --surface-warm: light-dark(#FFF4E8, #2A1A0C);
      color-scheme: light dark;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--fg); font-family:Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow:hidden;
    }
    .loading {
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(18px,4dvh,28px); padding:0 24px;
    }
    .scene {
      position:relative; width:min(78dvw, 340px); height:min(44dvw, 190px); overflow:visible;
    }
    .path {
      position:absolute; left:8%; right:8%; bottom:18%;
      height:3px; border-radius:9999px;
      background:repeating-linear-gradient(90deg, color-mix(in oklab,var(--fg)14%,transparent) 0 10px, transparent 10px 16px);
      filter:opacity(.5);
    }
    .runner {
      position:absolute; bottom:22%; left:0;
      width:clamp(56px,16dvw,78px); height:auto;
      will-change:transform;
      animation:runAcross 1.8s ease-in-out infinite;
      filter:drop-shadow(0 6px 18px color-mix(in oklab,var(--accent)16%,transparent));
    }
    @keyframes runAcross {
      0%   { transform:translateX(0) translateY(0) rotate(0deg); }
      10%  { transform:translateX(10%) translateY(-2px) rotate(-1deg); }
      20%  { transform:translateX(20%) translateY(0) rotate(0deg); }
      30%  { transform:translateX(30%) translateY(-2px) rotate(-1deg); }
      40%  { transform:translateX(40%) translateY(0) rotate(0deg); }
      50%  { transform:translateX(50%) translateY(-2px) rotate(-1deg); }
      60%  { transform:translateX(60%) translateY(0) rotate(0deg); }
      70%  { transform:translateX(70%) translateY(-2px) rotate(-1deg); }
      80%  { transform:translateX(80%) translateY(0) rotate(0deg); }
      90%  { transform:translateX(90%) translateY(-2px) rotate(-1deg); }
      100% { transform:translateX(110%) translateY(0) rotate(0deg); }
    }
    .icon {
      position:absolute; bottom:28%;
      width:clamp(18px,5dvw,24px); height:clamp(18px,5dvw,24px);
      display:flex; align-items:center; justify-content:center;
      border-radius:9999px; background:color-mix(in oklab,var(--bg)92%,transparent);
      box-shadow:0 4px 14px color-mix(in oklab,var(--fg)10%,transparent), inset 0 0 0 1px color-mix(in oklab,var(--fg)8%,transparent);
      opacity:0; will-change:transform,opacity;
      animation:iconPass 1.8s ease-in-out infinite;
    }
    .icon svg { width:60%; height:60%; display:block; }
    .icon.bike  { left:18%; animation-delay:.25s; }
    .icon.dumb  { left:38%; animation-delay:.5s; }
    .icon.run   { left:58%; animation-delay:.75s; }
    .icon.foot  { left:78%; animation-delay:1.0s; }
    @keyframes iconPass {
      0%   { opacity:0; transform:translateY(0) scale(.8); }
      10%  { opacity:1; transform:translateY(-6px) scale(1); }
      25%  { opacity:.9; transform:translateY(-4px) scale(1); }
      40%  { opacity:0; transform:translateY(4px) scale(.9); }
      100% { opacity:0; transform:translateY(4px) scale(.8); }
    }
    .progress {
      width:clamp(160px,48dvw,220px); height:4px; border-radius:9999px; background:color-mix(in oklab,var(--fg)8%,transparent);
      overflow:hidden; position:relative; box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--fg)6%,transparent);
    }
    .progress-bar {
      position:absolute; inset:0 auto 0 0; width:40%; background:linear-gradient(90deg, transparent 0%, var(--accent) 20%, color-mix(in oklab,#fff 30%,var(--accent)) 50%, var(--accent) 80%, transparent 100%);
      animation:progress 1.8s ease-in-out infinite; transform:translateX(-100%);
    }
    @keyframes progress {
      0% { transform:translateX(-100%); width:40%; }
      50% { transform:translateX(150%); width:60%; }
      100% { transform:translateX(250%); width:40%; }
    }
    .text {
      font-size:clamp(13px,3.2dvw,15px); font-weight:500; letter-spacing:.01em; opacity:.9; text-align:center;
      animation:textPulse 1.8s ease-in-out infinite;
    }
    @keyframes textPulse {
      0%,100% { opacity:.72; }
      50% { opacity:1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .runner, .icon, .progress-bar, .text { animation:none !important; }
    }
    .fade-out { animation:fadeOut .28s ease-out forwards; }
    @keyframes fadeOut { to { opacity:0; transform:scale(.995); } }
  </style>
</head>
<body>
  <main class="loading" id="splash">
    <div class="scene">
      <div class="path"></div>
      <img class="runner" src="movase-run-mobile.png" alt="Corredor Movase">
      <div class="icon bike" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="17" r="3"></circle>
          <circle cx="18" cy="17" r="3"></circle>
          <path d="M6 17l3-9h6l3 9"></path>
          <path d="M9 8h6"></path>
        </svg>
      </div>
      <div class="icon dumb" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7v10M18 7v10M6 12h12"></path>
        </svg>
      </div>
      <div class="icon run" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13" cy="4" r="2"></circle>
          <path d="M13 6v5l-2 4-3 2M11 11l-4 1-1 3M16 11l2 3v3"></path>
        </svg>
      </div>
      <div class="icon foot" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 18v-6a2 2 0 014 0v2h8a2 2 0 011.6 3.2L15 21"></path>
          <circle cx="9" cy="6" r="2"></circle>
        </svg>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
    <div class="text">Carregando…</div>
  </main>
  <script>
    const s=document.getElementById('splash');
    function go(){ s.classList.add('fade-out'); setTimeout(()=>location.href='movase-app.html',260); }
    setTimeout(go,1800); document.addEventListener('click',go,{once:true}); document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go();},{once:true});
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,viewport-fit=cover,initial-scale=1,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Movase — Carregando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: light-dark(#FFFFFF, #0C0A09);
      --fg: light-dark(#0A0A0A, #FAFAF9);
      --accent: #F58220;
      --surface-warm: light-dark(#FFF4E8, #2A1A0C);
      color-scheme: light dark;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--fg); font-family:Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow:hidden;
    }
    .loading {
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(20px,4dvh,32px); padding:0 24px;
    }
    .logo-wrap {
      position:relative; display:flex; align-items:center; justify-content:center;
      width:clamp(120px,36dvw,160px); height:clamp(120px,36dvw,160px);
      border-radius:9999px; background:radial-gradient(120% 120% at 50% 20%, var(--surface-warm) 0%, transparent 70%);
      will-change:transform, opacity, filter;
    }
    .logo {
      width:clamp(80px,24dvw,108px); height:auto; pointer-events:none; user-select:none;
      filter:drop-shadow(0 10px 40px color-mix(in oklab, var(--accent) 20%, transparent));
      will-change:transform;
      transform-origin:50% 40%;
    }
    .pulse {
      position:absolute; inset:0; border-radius:9999px;
      background:radial-gradient(60% 60% at 50% 50%, color-mix(in oklab, var(--accent) 24%, transparent) 0%, transparent 70%);
      opacity:0; transform:scale(.92);
      animation:pulse 1.8s ease-in-out infinite;
    }
    .pulse:nth-of-type(2){ animation-delay:.25s; }
    .pulse:nth-of-type(3){ animation-delay:.5s; }
    @keyframes pulse {
      0% { opacity:0; transform:scale(.92); }
      40% { opacity:.28; transform:scale(1.02); }
      100% { opacity:0; transform:scale(1.18); }
    }
    .logo-bounce {
      animation:logoBounce 1.6s cubic-bezier(.28,.84,.42,1) infinite;
    }
    @keyframes logoBounce {
      0%,100% { transform:translateY(0) scale(1); }
      50% { transform:translateY(-6px) scale(1.015); }
    }
    .logo-pop {
      animation:logoPopIn .5s cubic-bezier(.175,.885,.32,1.275) both;
    }
    @keyframes logoPopIn {
      0% { opacity:0; transform:scale(.88) translateY(6px); filter:blur(4px) drop-shadow(0 0 0 transparent); }
      100% { opacity:1; transform:scale(1) translateY(0); filter:blur(0) drop-shadow(0 10px 40px color-mix(in oklab, var(--accent) 20%, transparent)); }
    }
    .progress {
      width:clamp(160px,48dvw,220px); height:4px; border-radius:9999px; background:color-mix(in oklab, var(--fg) 8%, transparent);
      overflow:hidden; position:relative; box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--fg) 6%, transparent);
    }
    .progress-bar {
      position:absolute; inset:0 auto 0 0; width:40%; background:linear-gradient(90deg, transparent 0%, var(--accent) 20%, color-mix(in oklab, #fff 30%, var(--accent)) 50%, var(--accent) 80%, transparent 100%);
      animation:progress 1.8s ease-in-out infinite; will-change:transform,width;
      transform:translateX(-100%);
    }
    @keyframes progress {
      0% { transform:translateX(-100%); width:40%; }
      50% { transform:translateX(150%); width:60%; }
      100% { transform:translateX(250%); width:40%; }
    }
    .text {
      font-size:clamp(13px,3.2dvw,15px); font-weight:500; letter-spacing:.01em; opacity:.9; text-align:center;
      animation:textPulse 1.8s ease-in-out infinite;
    }
    @keyframes textPulse {
      0%,100% { opacity:.72; }
      50% { opacity:1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .logo-bounce, .progress-bar, .text { animation:none !important; }
      .logo { animation:logoPopIn .25s ease-out both !important; }
    }
    .splash-fade-out {
      animation:splashFadeOut .28s ease-out forwards;
    }
    @keyframes splashFadeOut {
      to { opacity:0; transform:scale(.995); }
    }
  </style>
</head>
<body>
  <main class="loading" id="splash">
    <div class="logo-wrap">
      <span class="pulse"></span>
      <span class="pulse"></span>
      <span class="pulse"></span>
      <img src="assets/logo-movase.png" alt="Movase" class="logo logo-pop logo-bounce">
    </div>
    <div class="progress" aria-hidden="true">
      <div class="progress-bar"></div>
    </div>
    <div class="text">Abrindo Movase…</div>
  </main>
  <script>
    const splash = document.getElementById('splash');
    function goToApp() {
      const fade = splash.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.995)'}],{duration:280,fill:'forwards',easing:'ease-out'});
      fade.onfinish = () => { location.href = 'movase-app.html'; };
    }
    setTimeout(goToApp, 1600);
    document.addEventListener('click', goToApp, {once:true});
    document.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ goToApp(); } }, {once:true});
  </script>
</body>
</html>
